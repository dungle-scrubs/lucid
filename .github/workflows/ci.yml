name: CI

# Pull requests, and main itself. Main was unverified for a while, and a broken
# build landed on it unnoticed: every PR opened afterwards went red on a defect
# none of them introduced, and the first author to look paid for all of them. A
# branch nothing checks is a branch that hands its breakage to the next person.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - run: bun install --frozen-lockfile

      # `bunx <tool>` falls back to the npm registry when the name is not
      # already resolvable, so a build that shells out through it stops honouring
      # the lockfile without saying so: this build emitted CSS from a Tailwind
      # that node_modules did not contain, which meant the bundle's bytes changed
      # whenever npm published, with no source change. Build scripts must name
      # the pinned install. (bunx is fine for lefthook, biome and playwright -
      # the hazard is only code that produces a shipped artifact.)
      - name: Guard against registry-resolved tools in the build
        run: |
          if grep -rnE '"(bunx|npx)"' scripts/; then
            echo "::error::scripts/ must resolve tools from the lockfile, not bunx/npx - see the match above"
            exit 1
          fi

      # First: src/server imports the generated client bundle, so nothing below
      # can typecheck, lint or run until it exists. It is not in git - Bun's
      # bundler does not emit byte-identical output for identical input, so a
      # tracked copy could only be verified by a byte comparison that fails at
      # random. Building it here is what makes it unnecessary to check.
      - run: bun run build

      - run: bun run typecheck

      - run: bun run lint

      - run: bun test test/*.test.ts

  # Playwright had never run outside a laptop. Every claim the e2e suite makes
  # rested on one developer's machine, one browser build, and a client bundle
  # that is gitignored - so a green local run could always have been a run
  # against yesterday's bundle. This job is the run everything else is judged by;
  # nothing in the coverage plan is measurable before it exists (D-009).
  #
  # Runner platform: ubuntu-latest, deliberately, and not because macOS is
  # untested by accident (D-029).
  #   - It matches `verify` above, so a PR exercises one toolchain rather than
  #     two, and Linux is where `playwright install --with-deps` has system
  #     packages to install at all (`installDeps` dispatches on linux and win32
  #     only; on darwin it is a no-op).
  #   - The two darwin-only branches in the product are not reachable from this
  #     suite anyway: `openChromeApp` (src/cli/self.ts) returns false whenever
  #     LUCID_NO_OPEN=1, which the harness sets on every invocation, and the
  #     AppleScript folder chooser (src/server/daemon.ts) needs one of the two
  #     folder routes - POST /hub/project or POST /hub/roots - with an empty
  #     path, which no test sends. Running the gate on macOS would not exercise
  #     them either: that gap belongs to the suite, and the LUCID_OPEN_LOG seam
  #     is what closes it. Worth knowing for the soak, though - off darwin the
  #     chooser answers 501 at once, while on darwin it blocks on a modal until
  #     the test times out, so a future test that forgets `path` is fast and
  #     green here and a 60s hang there.
  #   - `lock.ts` does not pick a different ALGORITHM off darwin, only a
  #     different libc to find `flock(2)` in. The real hazard is a silent
  #     fall-through to the lockfile mutex when dlopen fails on a runner image;
  #     the stamp step below puts the selected backend in the record and warns on
  #     the fallback. It does not fail the job - there are no concurrency
  #     assertions to protect yet, and blocking every unrelated test over a
  #     runner-image change would be the wrong trade. M5.4 owns the hard gate,
  #     alongside the scenarios that depend on it.
  # Darwin is still the platform Lucid ships on, so the nightly soak runs the
  # same suite on macos-latest as well - see nightly-e2e.yml.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - run: bun install --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      # Same reason as `verify`: src/server imports the generated client bundle,
      # and the suite drives the shell that bundle IS. Building it here is what
      # makes "the tests passed" a statement about this commit.
      #
      # This also builds dist/lucid, which nothing under test/ runs yet - every
      # harness spawn goes through `bun run src/cli/main.ts`. So a green job says
      # the binary COMPILES and nothing more; M0.2 owns building it once per run
      # deliberately, and the compiled-binary scenario is Phase 5's.
      - run: bun run build

      - name: Record the environment this run is judged by
        run: bun run scripts/e2e-stamp.ts

      # Today this is the whole suite. D-026 narrows the gate to `regression` plus
      # the fast parallel tests once those projects exist - but note the mechanism
      # is not settled: Playwright can scope `workers` per project, so the
      # parallel/serial split is expressible, while "every parallel test under 3s"
      # is not - there is no duration selector, only title and tag matching. That
      # set has to become a tag some test declares, which M6.2 decides once cost
      # is measured.
      - run: bunx playwright test

      # `test/e2e/catalogue.json` is the scope ledger: which of the 256 catalogued
      # scenarios are covered, and by which test. Nothing else in the repo reads
      # those rows, so a renamed test, a deleted one, or a row that claimed
      # coverage it never had all looked exactly like progress. This checks every
      # `covered` row against the run that just finished, and recomputes the
      # totals from the rows - the hand-written summary it replaces had drifted
      # to 257/35 while the rows said 256/39.
      #
      # After the suite, deliberately: the report is the evidence, so there is
      # nothing to check until it exists.
      - name: The catalogue agrees with the run
        run: bun run scripts/coverage-check.ts

      # A CI failure is not reproducible by re-reading the log - nobody has the
      # machine. Uploaded on failure AND on success: the JSON result file is what
      # the coverage ledger cross-checks its `covered` rows against, so a green
      # run has to leave it behind too.
      - name: Upload the run's evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
