name: CI

# Pull requests, and main itself. Main was unverified for a while, and a broken
# build landed on it unnoticed: every PR opened afterwards went red on a defect
# none of them introduced, and the first author to look paid for all of them. A
# branch nothing checks is a branch that hands its breakage to the next person.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - run: bun install --frozen-lockfile

      # `bunx <tool>` falls back to the npm registry when the name is not
      # already resolvable, so a build that shells out through it stops honouring
      # the lockfile without saying so: this build emitted CSS from a Tailwind
      # that node_modules did not contain, which meant the bundle's bytes changed
      # whenever npm published, with no source change. Build scripts must name
      # the pinned install. (bunx is fine for lefthook, biome and playwright -
      # the hazard is only code that produces a shipped artifact.)
      - name: Guard against registry-resolved tools in the build
        run: |
          if grep -rnE '"(bunx|npx)"' scripts/; then
            echo "::error::scripts/ must resolve tools from the lockfile, not bunx/npx - see the match above"
            exit 1
          fi

      # Beside the guard above and BEFORE the build, for the same reason: a
      # one-second grep should not cost a full bundle to reach.
      - run: bun run scripts/check-locators.ts

      # First: src/server imports the generated client bundle, so nothing below
      # can typecheck, lint or run until it exists. It is not in git - Bun's
      # bundler does not emit byte-identical output for identical input, so a
      # tracked copy could only be verified by a byte comparison that fails at
      # random. Building it here is what makes it unnecessary to check.
      - run: bun run build

      - run: bun run typecheck

      - run: bun run lint

      - run: bun test test/*.test.ts

      # The half of the ledger check that needs no browser: statuses that belong
      # to no bucket, a covered row naming no test, a declined row with no
      # reason, and a covered row owing a mutation that was never grandfathered.
      #
      # `--no-report` is not a weakening here, it is the whole of what CI can
      # honestly check. The other half cross-references a real Playwright run,
      # and Playwright runs on the maintainer's Mac, not here (D-044). A gate
      # that pretended otherwise would need a report this job cannot produce.
      - run: bun run scripts/coverage-check.ts --no-report

