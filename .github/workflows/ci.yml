name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      # The lockfile is the contract: an install that silently resolves a
      # different hcn would invalidate every fixture in test/fixtures/hcn,
      # which are recordings of one pinned version.
      - run: bun install --frozen-lockfile

      # Mirrors `bun run check` explicitly so each failed gate is named in
      # Actions rather than hidden behind one composite step.
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun run build:package

      # The deterministic suite drives a fake hcn, so CI never spawns a
      # harness and never needs credentials. The live lanes
      # (scripts/smoke-*.ts) are deferred by design - they need an installed
      # harness and are nondeterministic. They run on demand and write their
      # evidence under ignored artifacts/evidence/.
      - name: Confirm lucid imports no normalizer internals
        run: |
          if grep -rn 'harness-cli/src\|harness-cli/test' src test scripts; then
            echo "lucid must reach a harness through the hcn binary only (RFC-02)" >&2
            exit 1
          fi

      - name: Confirm protocol imports no store modules
        run: |
          if grep -rn '\.\./store/' src/protocol; then
            echo "protocol must not import store modules (RFC-13)" >&2
            exit 1
          fi

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Manifest-driven: reads release-please-config.json and
      # .release-please-manifest.json.
      - id: release
        uses: googleapis/release-please-action@v5

      # GITHUB_TOKEN-created pull requests do not start ordinary CI without
      # approval. workflow_dispatch is the supported recursive-run exception,
      # so the generated release branch receives the same required check.
      - name: Check the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"

      # Release Please publishes with GITHUB_TOKEN, so the resulting release
      # event cannot start another workflow. workflow_dispatch is the supported
      # recursive-run exception.
      - name: Publish the release to npm
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: >-
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
          --field tag="$RELEASE_TAG"
