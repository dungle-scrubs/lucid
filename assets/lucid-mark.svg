<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lucid mark">
  <!-- Lucid / Lucid logomark: a surface with one element held in the brass
       annotation outline (2px brass, offset) - the product's core gesture. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#131210"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" stroke="#f2ecdc" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- content lines on the surface -->
  <rect x="17" y="18.5" width="22" height="3.4" rx="1.7" fill="#e6dbc3" fill-opacity="0.5"/>
  <rect x="17" y="30.3" width="30" height="3.6" rx="1.8" fill="#f2ecdc"/>
  <rect x="17" y="42.1" width="18" height="3.4" rx="1.7" fill="#e6dbc3" fill-opacity="0.5"/>

  <!-- the annotation: brass outline around the middle element, with its marker dot -->
  <rect x="12.5" y="26.3" width="39" height="11.6" rx="3.5" stroke="#bd9a4e" stroke-width="2.4"/>
  <circle cx="12.5" cy="26.3" r="3.1" fill="#cba85a"/>
</svg>
