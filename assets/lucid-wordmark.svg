<svg width="232" height="56" viewBox="0 0 232 56" fill="none" xmlns="http://www.w3.org/2000/svg" color="#f2ecdc" role="img" aria-label="Lucid">
  <!-- Lucid wordmark: serif italic (EB Garamond) wordmark + the brass mark.
       Text uses currentColor; set `color` on a parent to recolor. -->
  <!-- compact mark -->
  <rect x="2" y="9" width="38" height="38" rx="9" fill="#131210"/>
  <rect x="9" y="19.5" width="13" height="2.4" rx="1.2" fill="#e6dbc3" fill-opacity="0.5"/>
  <rect x="9" y="26.8" width="18" height="2.6" rx="1.3" fill="#f2ecdc"/>
  <rect x="9" y="34.1" width="11" height="2.4" rx="1.2" fill="#e6dbc3" fill-opacity="0.5"/>
  <rect x="6.4" y="23.6" width="24.5" height="8.2" rx="2.6" stroke="#bd9a4e" stroke-width="1.7"/>
  <circle cx="6.4" cy="23.6" r="2.1" fill="#cba85a"/>

  <!-- wordmark -->
  <text x="56" y="40" font-family="'EB Garamond', Georgia, serif" font-style="italic" font-weight="500" font-size="40" letter-spacing="0.01em" fill="currentColor">Lucid</text>
</svg>
