<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucid - editor</title>

    <!-- The Lucid token system. Provides every var(--…) used below. -->
    <link rel="stylesheet" href="../../colors_and_type.css" />

    <!-- React 18 + ReactDOM UMD, then Babel Standalone for in-browser JSX. -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-sans);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #root {
        height: 100%;
      }
      /* quiet, on-brand scrollbars for the chrome + surface */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--ink-500);
        border-radius: var(--radius-pill);
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      textarea::placeholder {
        color: var(--fg-faint);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- One Babel-transpiled module. Mirrors the .jsx files inline for a no-build demo. -->
    <script type="text/babel" data-presets="react">
      const { useState } = React;

      /* =====================================================================
         Button.jsx (inlined)
         ===================================================================== */
      const buttonStyles = {
        base: {
          display: "inline-flex",
          alignItems: "center",
          justifyContent: "center",
          gap: "var(--space-2)",
          fontFamily: "var(--font-sans)",
          fontSize: "var(--text-sm)",
          fontWeight: "var(--weight-medium)",
          lineHeight: "var(--leading-snug)",
          letterSpacing: "var(--tracking-normal)",
          padding: "var(--space-2) var(--space-4)",
          borderRadius: "var(--radius-md)",
          border: "1px solid transparent",
          cursor: "pointer",
          userSelect: "none",
          boxShadow: "var(--shadow-none)",
          transition:
            "background var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease), color var(--dur-base) var(--ease)",
        },
        primary: { background: "var(--accent)", color: "var(--on-accent)", borderColor: "var(--accent)" },
        primaryHover: { background: "var(--accent-bright)", borderColor: "var(--accent-bright)" },
        secondary: { background: "var(--bg-overlay)", color: "var(--fg)", borderColor: "var(--border-strong)" },
        secondaryHover: { background: "var(--bg-raised)", borderColor: "var(--border-strong)" },
        ghost: { background: "transparent", color: "var(--fg-muted)", borderColor: "transparent" },
        ghostHover: { background: "var(--bg-overlay)", color: "var(--fg)" },
        danger: { background: "transparent", color: "var(--danger)", borderColor: "var(--border-strong)" },
        dangerHover: { background: "var(--danger-fill)", borderColor: "var(--danger)" },
        good: { background: "var(--agent-fill)", color: "var(--agent)", borderColor: "var(--border-strong)" },
        goodHover: { background: "var(--agent-fill)", borderColor: "var(--agent)" },
        disabled: { background: "transparent", color: "var(--fg-faint)", borderColor: "var(--border)", cursor: "not-allowed" },
      };

      function Button({ variant = "secondary", disabled = false, children, onClick, type = "button", style, ...rest }) {
        const [hover, setHover] = useState(false);
        const variantStyle = disabled
          ? buttonStyles.disabled
          : { ...buttonStyles[variant], ...(hover ? buttonStyles[variant + "Hover"] : null) };
        return (
          <button
            type={type}
            disabled={disabled}
            onClick={disabled ? undefined : onClick}
            onMouseEnter={() => setHover(true)}
            onMouseLeave={() => setHover(false)}
            style={{ ...buttonStyles.base, ...variantStyle, ...style }}
            {...rest}
          >
            {children}
          </button>
        );
      }

      /* =====================================================================
         Pill.jsx (inlined)
         ===================================================================== */
      const pillStyles = {
        base: {
          display: "inline-flex",
          alignItems: "center",
          gap: "var(--space-1)",
          fontFamily: "var(--font-sans)",
          fontSize: "var(--text-xs)",
          fontWeight: "var(--weight-medium)",
          lineHeight: 1,
          letterSpacing: "var(--tracking-wide)",
          padding: "var(--space-1) var(--space-2)",
          borderRadius: "var(--radius-pill)",
          border: "1px solid transparent",
          whiteSpace: "nowrap",
        },
        located: { background: "var(--annot-fill)", color: "var(--accent-bright)", borderColor: "var(--brass-700)" },
        orphaned: { background: "var(--danger-fill)", color: "var(--danger)", borderColor: "var(--rust-500)" },
        version: {
          background: "var(--bg-inset)",
          color: "var(--fg-muted)",
          borderColor: "var(--border-strong)",
          fontFamily: "var(--font-mono)",
          fontSize: "var(--text-xs)",
          letterSpacing: "var(--tracking-normal)",
        },
        status: {
          background: "var(--bg-overlay)",
          color: "var(--fg-muted)",
          borderColor: "var(--border)",
          textTransform: "uppercase",
          letterSpacing: "var(--tracking-caps)",
          fontSize: "var(--text-xs)",
          fontWeight: "var(--weight-semibold)",
        },
        dot: {
          width: "5px",
          height: "5px",
          borderRadius: "var(--radius-pill)",
          background: "var(--annot-color)",
          flex: "0 0 auto",
        },
      };

      function Pill({ variant = "status", children, withDot = false, style, ...rest }) {
        return (
          <span style={{ ...pillStyles.base, ...pillStyles[variant], ...style }} {...rest}>
            {withDot ? <span style={pillStyles.dot} /> : null}
            {children}
          </span>
        );
      }

      /* =====================================================================
         TopBar.jsx (inlined)
         ===================================================================== */
      const topBarStyles = {
        bar: {
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          gap: "var(--space-3)",
          height: "52px",
          padding: "0 var(--space-4)",
          background: "var(--bg-raised)",
          borderBottom: "1px solid var(--border)",
          flex: "0 0 auto",
        },
        brand: { display: "inline-flex", alignItems: "center", gap: "var(--space-2)", minWidth: 0 },
        mark: { width: "22px", height: "22px", flex: "0 0 auto", display: "block", color: "var(--accent)" },
        wordmark: {
          fontFamily: "var(--font-serif)",
          fontStyle: "italic",
          fontWeight: "var(--weight-medium)",
          fontSize: "var(--text-lg)",
          lineHeight: 1,
          letterSpacing: "var(--tracking-tight)",
          color: "var(--fg-strong)",
        },
        title: {
          fontFamily: "var(--font-sans)",
          fontSize: "var(--text-sm)",
          color: "var(--fg-muted)",
          whiteSpace: "nowrap",
          overflow: "hidden",
          textOverflow: "ellipsis",
          borderLeft: "1px solid var(--border)",
          paddingLeft: "var(--space-3)",
          marginLeft: "var(--space-1)",
        },
        controls: { display: "inline-flex", alignItems: "center", gap: "var(--space-1)", flex: "0 0 auto" },
        control: {
          display: "inline-flex",
          alignItems: "center",
          gap: "var(--space-2)",
          background: "transparent",
          border: "1px solid transparent",
          borderRadius: "var(--radius-md)",
          padding: "var(--space-1) var(--space-2)",
          fontFamily: "var(--font-sans)",
          fontSize: "var(--text-sm)",
          color: "var(--fg-muted)",
          cursor: "pointer",
          transition: "background var(--dur-base) var(--ease), color var(--dur-base) var(--ease)",
        },
      };

      function BrandMark() {
        return (
          <svg
            style={topBarStyles.mark}
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="1.5"
            strokeLinecap="round"
            strokeLinejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="18" height="18" rx="3" stroke="var(--border-strong)" />
            <line x1="7" y1="8.5" x2="14" y2="8.5" stroke="var(--fg-faint)" />
            <line x1="7" y1="15.5" x2="12" y2="15.5" stroke="var(--fg-faint)" />
            <rect x="5.5" y="11" width="13" height="3.4" rx="1.2" stroke="var(--accent)" />
            <circle cx="5.5" cy="12.7" r="1.1" fill="var(--accent)" stroke="var(--accent)" />
          </svg>
        );
      }

      function QuietControl({ children, onClick }) {
        const [hover, setHover] = useState(false);
        return (
          <button
            type="button"
            onClick={onClick}
            onMouseEnter={() => setHover(true)}
            onMouseLeave={() => setHover(false)}
            style={{ ...topBarStyles.control, ...(hover ? { background: "var(--bg-overlay)", color: "var(--fg)" } : null) }}
          >
            {children}
          </button>
        );
      }

      function TopBar({ title = "Database migration plan", version = "v2" }) {
        return (
          <header style={topBarStyles.bar}>
            <div style={topBarStyles.brand}>
              <BrandMark />
              <span style={topBarStyles.wordmark}>Lucid</span>
              <span style={topBarStyles.title}>{title}</span>
            </div>
            <div style={topBarStyles.controls}>
              <Pill variant="version">{version}</Pill>
              <QuietControl>History</QuietControl>
              <QuietControl>Share</QuietControl>
            </div>
          </header>
        );
      }

      /* =====================================================================
         Bubble.jsx (inlined)
         ===================================================================== */
      const bubbleStyles = {
        row: { display: "flex", flexDirection: "column", gap: "var(--space-1)" },
        rowUser: { alignItems: "flex-end" },
        rowAgent: { alignItems: "flex-start" },
        eyebrow: {
          display: "inline-flex",
          alignItems: "center",
          gap: "var(--space-2)",
          fontFamily: "var(--font-sans)",
          fontSize: "var(--text-xs)",
          fontWeight: "var(--weight-semibold)",
          textTransform: "uppercase",
          letterSpacing: "var(--tracking-caps)",
        },
        eyebrowAgent: { color: "var(--agent)" },
        eyebrowUser: { color: "var(--user)" },
        time: {
          fontFamily: "var(--font-mono)",
          fontSize: "var(--text-xs)",
          fontWeight: "var(--weight-regular)",
          letterSpacing: "var(--tracking-normal)",
          color: "var(--fg-faint)",
          textTransform: "none",
        },
        bubble: {
          maxWidth: "85%",
          fontFamily: "var(--font-sans)",
          fontSize: "var(--text-sm)",
          lineHeight: "var(--leading-normal)",
          color: "var(--fg)",
          padding: "var(--space-2) var(--space-3)",
          borderRadius: "var(--radius-md)",
          border: "1px solid var(--border)",
          boxShadow: "var(--shadow-none)",
        },
        bubbleAgent: { background: "var(--agent-fill)", borderColor: "var(--border)", borderTopLeftRadius: "var(--radius-sm)" },
        bubbleUser: { background: "var(--user-fill)", borderColor: "var(--border)", borderTopRightRadius: "var(--radius-sm)" },
      };

      function Bubble({ variant = "agent", author, time, children }) {
        const isUser = variant === "user";
        const label = author || (isUser ? "You" : "The agent");
        return (
          <div style={{ ...bubbleStyles.row, ...(isUser ? bubbleStyles.rowUser : bubbleStyles.rowAgent) }}>
            <span style={{ ...bubbleStyles.eyebrow, ...(isUser ? bubbleStyles.eyebrowUser : bubbleStyles.eyebrowAgent) }}>
              {label}
              {time ? <span style={bubbleStyles.time}>{time}</span> : null}
            </span>
            <div style={{ ...bubbleStyles.bubble, ...(isUser ? bubbleStyles.bubbleUser : bubbleStyles.bubbleAgent) }}>
              {children}
            </div>
          </div>
        );
      }

      /* =====================================================================
         AnnotationCard.jsx (inlined) - the one floating, shadowed surface
         ===================================================================== */
      const cardStyles = {
        card: {
          position: "relative",
          width: "300px",
          background: "var(--bg-raised)",
          border: "1px solid var(--border-strong)",
          borderRadius: "var(--radius-lg)",
          boxShadow: "var(--shadow-floating)",
          padding: "var(--space-4)",
          display: "flex",
          flexDirection: "column",
          gap: "var(--space-3)",
          fontFamily: "var(--font-sans)",
        },
        beak: {
          position: "absolute",
          left: "-6px",
          top: "var(--space-5)",
          width: "10px",
          height: "10px",
          background: "var(--bg-raised)",
          borderLeft: "1px solid var(--border-strong)",
          borderBottom: "1px solid var(--border-strong)",
          transform: "rotate(45deg)",
        },
        header: { display: "flex", alignItems: "center", justifyContent: "space-between", gap: "var(--space-2)" },
        cursor: { fontFamily: "var(--font-mono)", fontSize: "var(--text-xs)", color: "var(--fg-faint)", letterSpacing: "var(--tracking-normal)" },
        snippet: {
          fontFamily: "var(--font-mono)",
          fontSize: "var(--text-xs)",
          lineHeight: "var(--leading-snug)",
          color: "var(--fg)",
          background: "var(--bg-inset)",
          border: "1px solid var(--border-inset)",
          borderLeft: "2px solid var(--annot-color)",
          borderRadius: "var(--radius-sm)",
          padding: "var(--space-2) var(--space-3)",
        },
        note: { fontFamily: "var(--font-sans)", fontSize: "var(--text-sm)", lineHeight: "var(--leading-normal)", color: "var(--fg-strong)", margin: 0 },
        footer: {
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          gap: "var(--space-2)",
          paddingTop: "var(--space-1)",
          borderTop: "1px solid var(--border)",
        },
        attribution: { display: "inline-flex", alignItems: "center", gap: "var(--space-2)", fontFamily: "var(--font-sans)", fontSize: "var(--text-xs)", color: "var(--fg-muted)" },
        who: { fontWeight: "var(--weight-semibold)", textTransform: "uppercase", letterSpacing: "var(--tracking-caps)" },
        whoUser: { color: "var(--user)" },
        whoAgent: { color: "var(--agent)" },
        actions: { display: "inline-flex", alignItems: "center", gap: "var(--space-1)" },
        action: {
          background: "transparent",
          border: "none",
          borderRadius: "var(--radius-sm)",
          padding: "var(--space-1) var(--space-2)",
          fontFamily: "var(--font-sans)",
          fontSize: "var(--text-xs)",
          color: "var(--fg-muted)",
          cursor: "pointer",
          transition: "background var(--dur-base) var(--ease), color var(--dur-base) var(--ease)",
        },
        actionDanger: { color: "var(--danger)" },
      };

      function CardAction({ children, danger = false, onClick }) {
        const [hover, setHover] = useState(false);
        return (
          <button
            type="button"
            onClick={onClick}
            onMouseEnter={() => setHover(true)}
            onMouseLeave={() => setHover(false)}
            style={{
              ...cardStyles.action,
              ...(danger ? cardStyles.actionDanger : null),
              ...(hover ? { background: danger ? "var(--danger-fill)" : "var(--bg-overlay)", color: danger ? "var(--danger)" : "var(--fg)" } : null),
            }}
          >
            {children}
          </button>
        );
      }

      function AnnotationCard({ cursor = "evt_00042", snippet, note, who = "user", version = "v2", withBeak = true, onResolve, onDiscard, style }) {
        const isUser = who === "user";
        return (
          <article style={{ ...cardStyles.card, ...style }}>
            {withBeak ? <span style={cardStyles.beak} /> : null}
            <div style={cardStyles.header}>
              <Pill variant="located" withDot>located · {version}</Pill>
              <span style={cardStyles.cursor}>{cursor}</span>
            </div>
            {snippet ? <div style={cardStyles.snippet}>{snippet}</div> : null}
            <p style={cardStyles.note}>{note}</p>
            <div style={cardStyles.footer}>
              <span style={cardStyles.attribution}>
                <span style={{ ...cardStyles.who, ...(isUser ? cardStyles.whoUser : cardStyles.whoAgent) }}>
                  {isUser ? "You" : "The agent"}
                </span>
              </span>
              <span style={cardStyles.actions}>
                <CardAction onClick={onResolve}>Resolve</CardAction>
                <CardAction danger onClick={onDiscard}>Discard</CardAction>
              </span>
            </div>
          </article>
        );
      }

      /* =====================================================================
         Editor.jsx (inlined)
         ===================================================================== */
      const editorStyles = {
        shell: { display: "flex", flexDirection: "column", height: "100vh", width: "100vw", background: "var(--bg)", color: "var(--fg)", fontFamily: "var(--font-sans)", overflow: "hidden" },
        body: { display: "grid", gridTemplateColumns: "384px 1fr", flex: "1 1 auto", minHeight: 0 },
        chrome: { display: "flex", flexDirection: "column", minHeight: 0, background: "var(--bg-raised)", borderRight: "1px solid var(--border)" },
        chromeScroll: { flex: "1 1 auto", minHeight: 0, overflowY: "auto", display: "flex", flexDirection: "column" },
        section: { padding: "var(--space-4)", borderBottom: "1px solid var(--border)", display: "flex", flexDirection: "column", gap: "var(--space-3)" },
        sectionHead: { display: "flex", alignItems: "center", justifyContent: "space-between", gap: "var(--space-2)" },
        eyebrow: { fontFamily: "var(--font-sans)", fontSize: "var(--text-xs)", fontWeight: "var(--weight-semibold)", textTransform: "uppercase", letterSpacing: "var(--tracking-caps)", color: "var(--fg-muted)", margin: 0 },
        count: { fontFamily: "var(--font-mono)", fontSize: "var(--text-xs)", color: "var(--fg-faint)" },
        hint: { fontFamily: "var(--font-sans)", fontSize: "var(--text-sm)", lineHeight: "var(--leading-normal)", color: "var(--fg-muted)", margin: 0 },
        composer: { display: "flex", flexDirection: "column", gap: "var(--space-3)" },
        capturedLabel: { fontFamily: "var(--font-sans)", fontSize: "var(--text-xs)", color: "var(--fg-faint)", letterSpacing: "var(--tracking-wide)" },
        captured: {
          fontFamily: "var(--font-mono)",
          fontSize: "var(--text-xs)",
          lineHeight: "var(--leading-snug)",
          color: "var(--fg)",
          background: "var(--bg-inset)",
          border: "1px solid var(--border-inset)",
          borderLeft: "2px solid var(--annot-color)",
          borderRadius: "var(--radius-sm)",
          padding: "var(--space-2) var(--space-3)",
        },
        textarea: {
          width: "100%",
          boxSizing: "border-box",
          resize: "none",
          minHeight: "72px",
          fontFamily: "var(--font-sans)",
          fontSize: "var(--text-sm)",
          lineHeight: "var(--leading-normal)",
          color: "var(--fg)",
          background: "var(--bg-inset)",
          border: "1px solid var(--border-inset)",
          borderRadius: "var(--radius-md)",
          padding: "var(--space-3)",
          outline: "none",
          transition: "border-color var(--dur-base) var(--ease)",
        },
        composerActions: { display: "flex", alignItems: "center", gap: "var(--space-2)" },
        list: { display: "flex", flexDirection: "column", gap: "var(--space-2)" },
        item: {
          display: "flex",
          flexDirection: "column",
          gap: "var(--space-2)",
          textAlign: "left",
          width: "100%",
          boxSizing: "border-box",
          background: "var(--bg-overlay)",
          border: "1px solid var(--border)",
          borderRadius: "var(--radius-md)",
          padding: "var(--space-3)",
          cursor: "pointer",
          boxShadow: "var(--shadow-none)",
          transition: "background var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease)",
        },
        itemActive: { borderColor: "var(--accent-dim)", background: "var(--bg-overlay)" },
        itemHover: { borderColor: "var(--border-strong)" },
        itemHead: { display: "flex", alignItems: "center", justifyContent: "space-between", gap: "var(--space-2)" },
        itemSnippet: { fontFamily: "var(--font-mono)", fontSize: "var(--text-xs)", color: "var(--fg-muted)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" },
        itemNote: { fontFamily: "var(--font-sans)", fontSize: "var(--text-sm)", lineHeight: "var(--leading-normal)", color: "var(--fg)", margin: 0 },
        orphanGroup: { display: "flex", flexDirection: "column", gap: "var(--space-2)", marginTop: "var(--space-2)" },
        queuedItem: { display: "flex", flexDirection: "column", gap: "var(--space-1)", background: "var(--annot-fill)", border: "1px solid var(--brass-700)", borderRadius: "var(--radius-md)", padding: "var(--space-3)" },
        queuedSnippet: { fontFamily: "var(--font-mono)", fontSize: "var(--text-xs)", color: "var(--accent-bright)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" },
        queuedNote: { fontFamily: "var(--font-sans)", fontSize: "var(--text-sm)", lineHeight: "var(--leading-normal)", color: "var(--fg)", margin: 0 },
        conversation: { display: "flex", flexDirection: "column", gap: "var(--space-4)" },
        footer: { flex: "0 0 auto", padding: "var(--space-4)", borderTop: "1px solid var(--border)", background: "var(--bg-raised)", display: "flex", flexDirection: "column", gap: "var(--space-3)" },
        footerActions: { display: "flex", alignItems: "center", justifyContent: "space-between", gap: "var(--space-2)" },
        approvedBar: { display: "flex", alignItems: "center", gap: "var(--space-2)", background: "var(--agent-fill)", border: "1px solid var(--sage-600)", borderRadius: "var(--radius-md)", padding: "var(--space-2) var(--space-3)", fontFamily: "var(--font-sans)", fontSize: "var(--text-sm)", color: "var(--agent)" },
        surfaceWrap: { position: "relative", minWidth: 0, overflowY: "auto", background: "var(--bg)", padding: "var(--space-12) var(--space-8)", display: "flex", justifyContent: "center" },
        paper: { position: "relative", width: "100%", maxWidth: "640px", background: "var(--surface)", color: "var(--surface-ink)", borderRadius: "var(--radius-lg)", padding: "var(--space-12) var(--space-12)" },
        artifactMeta: { fontFamily: "var(--font-mono)", fontSize: "var(--text-xs)", letterSpacing: "var(--tracking-caps)", textTransform: "uppercase", color: "var(--brass-700)", margin: "0 0 var(--space-3) 0" },
        h1: { fontFamily: "var(--font-serif)", fontWeight: "var(--weight-semibold)", fontSize: "var(--text-2xl)", lineHeight: "var(--leading-tight)", letterSpacing: "var(--tracking-tight)", color: "var(--surface-ink)", margin: "0 0 var(--space-6) 0" },
        lead: { fontFamily: "var(--font-serif)", fontSize: "var(--text-md)", lineHeight: "var(--leading-relaxed)", color: "var(--surface-ink)", margin: "0 0 var(--space-6) 0" },
        ol: { fontFamily: "var(--font-serif)", fontSize: "var(--text-md)", lineHeight: "var(--leading-relaxed)", color: "var(--surface-ink)", margin: "0 0 var(--space-6) 0", paddingLeft: "var(--space-6)", display: "flex", flexDirection: "column", gap: "var(--space-2)" },
        li: { paddingLeft: "var(--space-1)", borderRadius: "var(--radius-sm)", cursor: "pointer", transition: "outline-color var(--dur-base) var(--ease)" },
        para: { fontFamily: "var(--font-serif)", fontSize: "var(--text-md)", lineHeight: "var(--leading-relaxed)", color: "var(--surface-ink)", margin: 0 },
        range: { background: "var(--annot-fill)", borderRadius: "var(--radius-sm)", padding: "0 2px", cursor: "pointer", transition: "background var(--dur-base) var(--ease)" },
        rangeMarker: { color: "var(--annot-color)", fontFamily: "var(--font-mono)", fontSize: "var(--text-xs)", verticalAlign: "super", marginRight: "1px", userSelect: "none" },
        cardLayer: { position: "absolute", top: "var(--space-12)", right: "calc(-1 * var(--space-10))", zIndex: 5 },
      };

      function elementOutline(on) {
        return {
          outline: on ? "var(--annot-outline-width) solid var(--annot-color)" : "var(--annot-outline-width) solid transparent",
          outlineOffset: "var(--annot-outline-offset)",
        };
      }

      const LIST_ITEMS = [
        { id: "step-1", text: "Take the service into a read-only window." },
        { id: "step-2", text: "Backfill the new columns from the existing rows." },
        { id: "step-3", text: "Cut writes over to the new schema and verify counts." },
        { id: "step-4", text: "Drop the deprecated columns once parity holds." },
      ];

      const RANGE_TEXT = "before any write traffic resumes";

      function CheckIcon() {
        return (
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        );
      }

      function Editor() {
        const [selected, setSelected] = useState("element:step-2");
        const [focusedMark, setFocusedMark] = useState(null);
        const [draft, setDraft] = useState("Backfill must run first - verify counts before any write traffic resumes.");
        const [queued, setQueued] = useState([]);
        const [message, setMessage] = useState("");
        const [approved, setApproved] = useState(false);
        const [hoverItem, setHoverItem] = useState(null);

        const located = [
          { id: "element:step-2", snippet: "Backfill the new columns…", note: "Backfill must run first. Reorder this above the cut-over step.", version: "v2" },
          { id: "range:para", snippet: "before any write traffic resumes", note: "Verify row counts here, not after writes resume.", version: "v2" },
        ];
        const orphaned = [
          { id: "orphan:1", snippet: "rollback in under a minute", note: "This sentence was removed in v2; the anchor no longer attaches." },
        ];

        const composerOpen = selected != null;
        const capturedSnippet =
          selected === "range:para"
            ? RANGE_TEXT
            : selected === "element:step-2"
            ? "Backfill the new columns from the existing rows."
            : selected
            ? (LIST_ITEMS.find((i) => "element:" + i.id === selected) || {}).text || ""
            : "";

        function selectElement(id) { setSelected("element:" + id); }

        function addToQueue() {
          if (!draft.trim() || !selected) return;
          setQueued((q) => [...q, { id: "q-" + Date.now(), snippet: capturedSnippet, note: draft.trim() }]);
          setDraft("");
          setSelected(null);
        }
        function discardDraft() { setDraft(""); setSelected(null); }
        function sendMessage() { setQueued([]); setMessage(""); }

        const markActive = (markId) => selected === markId || focusedMark === markId;

        return (
          <div style={editorStyles.shell}>
            <TopBar title="Database migration plan" version="v2" />
            <div style={editorStyles.body}>
              {/* LEFT CHROME */}
              <aside style={editorStyles.chrome}>
                <div style={editorStyles.chromeScroll}>
                  <section style={editorStyles.section}>
                    <div style={editorStyles.sectionHead}>
                      <p style={editorStyles.eyebrow}>New annotation</p>
                    </div>
                    {composerOpen ? (
                      <div style={editorStyles.composer}>
                        <span style={editorStyles.capturedLabel}>
                          {selected.startsWith("range") ? "Captured range" : "Captured element"}
                        </span>
                        <div style={editorStyles.captured}>{capturedSnippet}</div>
                        <textarea
                          style={editorStyles.textarea}
                          value={draft}
                          placeholder="Say what you mean. The agent gets it."
                          onChange={(e) => setDraft(e.target.value)}
                          onFocus={(e) => (e.target.style.borderColor = "var(--accent-dim)")}
                          onBlur={(e) => (e.target.style.borderColor = "var(--border-inset)")}
                        />
                        <div style={editorStyles.composerActions}>
                          <Button variant="primary" onClick={addToQueue} disabled={!draft.trim()}>Add to queue</Button>
                          <Button variant="ghost" onClick={discardDraft}>Discard</Button>
                        </div>
                      </div>
                    ) : (
                      <p style={editorStyles.hint}>Select an element or a phrase on the surface to begin an annotation.</p>
                    )}
                  </section>

                  <section style={editorStyles.section}>
                    <div style={editorStyles.sectionHead}>
                      <p style={editorStyles.eyebrow}>Queued</p>
                      <span style={editorStyles.count}>{queued.length}</span>
                    </div>
                    {queued.length === 0 ? (
                      <p style={editorStyles.hint}>Nothing queued. Added annotations wait here until you send.</p>
                    ) : (
                      <div style={editorStyles.list}>
                        {queued.map((q) => (
                          <div key={q.id} style={editorStyles.queuedItem}>
                            <span style={editorStyles.queuedSnippet}>{q.snippet}</span>
                            <p style={editorStyles.queuedNote}>{q.note}</p>
                          </div>
                        ))}
                      </div>
                    )}
                  </section>

                  <section style={editorStyles.section}>
                    <div style={editorStyles.sectionHead}>
                      <p style={editorStyles.eyebrow}>Annotations</p>
                      <span style={editorStyles.count}>{located.length + orphaned.length}</span>
                    </div>
                    <div style={editorStyles.list}>
                      {located.map((a) => {
                        const isActive = selected === a.id;
                        const isHover = hoverItem === a.id;
                        return (
                          <button
                            key={a.id}
                            type="button"
                            style={{ ...editorStyles.item, ...(isHover ? editorStyles.itemHover : null), ...(isActive ? editorStyles.itemActive : null) }}
                            onClick={() => setSelected(a.id)}
                            onMouseEnter={() => { setHoverItem(a.id); setFocusedMark(a.id); }}
                            onMouseLeave={() => { setHoverItem(null); setFocusedMark(null); }}
                          >
                            <div style={editorStyles.itemHead}>
                              <Pill variant="located" withDot>located · {a.version}</Pill>
                              <span style={editorStyles.itemSnippet}>{a.snippet}</span>
                            </div>
                            <p style={editorStyles.itemNote}>{a.note}</p>
                          </button>
                        );
                      })}
                    </div>

                    <div style={editorStyles.orphanGroup}>
                      <div style={editorStyles.sectionHead}>
                        <p style={editorStyles.eyebrow}>Orphaned</p>
                        <span style={editorStyles.count}>{orphaned.length}</span>
                      </div>
                      <div style={editorStyles.list}>
                        {orphaned.map((a) => (
                          <div key={a.id} style={editorStyles.item}>
                            <div style={editorStyles.itemHead}>
                              <Pill variant="orphaned">orphaned</Pill>
                              <span style={editorStyles.itemSnippet}>{a.snippet}</span>
                            </div>
                            <p style={editorStyles.itemNote}>{a.note}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  </section>

                  <section style={editorStyles.section}>
                    <div style={editorStyles.sectionHead}>
                      <p style={editorStyles.eyebrow}>Conversation</p>
                    </div>
                    <div style={editorStyles.conversation}>
                      <Bubble variant="agent" author="The agent" time="evt_00018">
                        I drafted a four-step migration plan with a read-only window and a backfill.
                      </Bubble>
                      <Bubble variant="user" author="You" time="evt_00031">
                        The backfill has to run before the cut-over. I marked the two steps.
                      </Bubble>
                      <Bubble variant="agent" author="The agent" time="evt_00040">
                        Reordered the steps and moved verification before writes resume. Re-rendered as v2.
                      </Bubble>
                    </div>
                  </section>
                </div>

                <div style={editorStyles.footer}>
                  {approved ? (
                    <div style={editorStyles.approvedBar}>
                      <CheckIcon />
                      Review approved. v2 returned to the agent.
                    </div>
                  ) : null}
                  <textarea
                    style={{ ...editorStyles.textarea, minHeight: "60px" }}
                    value={message}
                    placeholder="Message the agent, or send the queued annotations."
                    onChange={(e) => setMessage(e.target.value)}
                    onFocus={(e) => (e.target.style.borderColor = "var(--accent-dim)")}
                    onBlur={(e) => (e.target.style.borderColor = "var(--border-inset)")}
                  />
                  <div style={editorStyles.footerActions}>
                    <Button variant="secondary" onClick={sendMessage}>
                      Send message
                      {queued.length > 0 ? <Pill variant="located">{queued.length}</Pill> : null}
                    </Button>
                    <Button variant="good" onClick={() => setApproved((v) => !v)}>
                      {approved ? "Reopen review" : "Approve review"}
                    </Button>
                  </div>
                </div>
              </aside>

              {/* RIGHT SURFACE */}
              <main style={editorStyles.surfaceWrap}>
                <article style={editorStyles.paper}>
                  <p style={editorStyles.artifactMeta}>Artifact · v2</p>
                  <h1 style={editorStyles.h1}>Database migration plan</h1>
                  <p style={editorStyles.lead}>
                    We move the orders table to the new schema without downtime, in a read-only
                    window narrow enough that no caller notices.
                  </p>

                  <ol style={editorStyles.ol}>
                    {LIST_ITEMS.map((item) => {
                      const markId = "element:" + item.id;
                      const isMarked = item.id === "step-2";
                      const on = isMarked && markActive(markId);
                      return (
                        <li
                          key={item.id}
                          style={{ ...editorStyles.li, ...(isMarked ? elementOutline(on) : null) }}
                          onClick={() => selectElement(item.id)}
                        >
                          {item.text}
                        </li>
                      );
                    })}
                  </ol>

                  <p style={editorStyles.para}>
                    The cut-over is reversible up to the final step: counts are reconciled{" "}
                    <span
                      style={{ ...editorStyles.range, background: markActive("range:para") ? "var(--annot-fill-strong)" : "var(--annot-fill)" }}
                      onClick={(e) => { e.stopPropagation(); setSelected("range:para"); }}
                    >
                      <span style={editorStyles.rangeMarker}>✎</span>
                      {RANGE_TEXT}
                    </span>
                    , so a mismatch halts the migration before it can do harm.
                  </p>

                  <div style={editorStyles.cardLayer}>
                    <AnnotationCard
                      cursor="evt_00031"
                      snippet="Backfill the new columns from the existing rows."
                      note="Backfill must run first. Reorder this above the cut-over step."
                      who="user"
                      version="v2"
                      onResolve={() => setSelected(null)}
                      onDiscard={() => setSelected(null)}
                    />
                  </div>
                </article>
              </main>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<Editor />);
    </script>
  </body>
</html>
