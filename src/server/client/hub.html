<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lucid · documents</title>
    <!-- Keep this synchronous: Bun merges module scripts and drops blocking=render.
         theme-bootstrap.test.ts checks these rules against the shared preference owner. -->
    <script id="lucid-theme-bootstrap-hub">
      (() => {
        let preference;
        try { preference = localStorage.getItem("lucid.theme.v1"); } catch {}
        let dark = preference === "dark";
        if (preference !== "light" && preference !== "dark") {
          try { dark = matchMedia("(prefers-color-scheme: dark)").matches; } catch {}
        }
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="stylesheet" href="./hub.css" />
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body><div id="root"></div><script type="module" src="./hub.tsx"></script></body>
</html>
